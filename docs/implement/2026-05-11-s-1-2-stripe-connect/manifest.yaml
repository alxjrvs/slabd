scope_note: |
  S-1.2 Seller onboards via Stripe Connect Express. Builds atop the
  backend scaffold (#46) which already provisions a `seller_accounts`
  table with `stripe_account_id` + `onboarding_status` columns. Targets
  REQ-006 (escrow processor), REQ-008 (dual buyer/seller mode), REQ-009
  (verified-tier badge precursor — onboarding state surfaces in profile),
  REQ-030 (Stripe Connect). Sandbox Stripe Connect Express flow: create
  Account → Account Link → return from Stripe → reconcile via webhook →
  gate listing publication on completed onboarding.
