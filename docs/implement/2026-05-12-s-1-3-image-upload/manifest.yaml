scope_note: |
  S-1.3 Image upload pipeline. Sellers select up to 8 images per listing;
  each uploads direct to Cloudflare R2 via short-lived signed URL.
  Cloudflare Images delivers card/thumb/detail variants. EXIF stripped on
  upload. Primary image selectable; ordering persisted. Targets REQ-004
  (image-first listings), REQ-021 (mobile upload UX), REQ-032 (transform
  pipeline). Backend-only first; mobile picker integration is a separate
  client-side story.
